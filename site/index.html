<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>就職選考 統合管理</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="side no-print">
    <div class="brand">
      <span class="brand-mark">就</span>
      <div><div class="brand-name">就職選考 統合管理</div><div class="brand-year" id="yearLabel"></div></div>
    </div>
    <nav id="nav" aria-label="画面"></nav>
  </aside>

  <div class="main">
    <header class="top no-print">
      <div class="file-info">
        <span class="file-label">データファイル</span>
        <span class="file-name" id="fileName"></span>
        <span class="save-state" id="saveState"></span>
      </div>
      <div class="top-actions">
        <button class="btn btn-sm" id="btnOpen">開く</button>
        <button class="btn btn-sm btn-primary" id="btnSave" title="Ctrl+S">上書き保存</button>
        <button class="btn btn-sm" id="btnSaveAs">名前を付けて保存</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="modalRoot" class="no-print"></div>
<div id="toast" class="toast-wrap no-print" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script src="lib/xlsx.full.min.js"></script>
<script src="js/core.js"></script>
<script src="js/ui.js"></script>
<script src="js/excel.js"></script>
<script src="js/watch.js"></script>
<script src="js/backup.js"></script>
<script src="js/survey.js"></script>
<script src="js/history.js"></script>
<script src="js/outcomes.js"></script>
<script src="js/docs.js"></script>
<script src="js/yearend-docs.js"></script>
<script src="js/pages/planned.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/survey.js"></script>
<script src="js/pages/jobs.js"></script>
<script src="js/pages/students.js"></script>
<script src="js/pages/ranking.js"></script>
<script src="js/pages/selection.js"></script>
<script src="js/pages/visits.js"></script>
<script src="js/pages/applications.js"></script>
<script src="js/pages/second.js"></script>
<script src="js/pages/reports.js"></script>
<script src="js/pages/outcomes.js"></script>
<script src="js/pages/yearend.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/pages/docset.js"></script>
<script src="js/pages/manual.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
</body>
</html>
